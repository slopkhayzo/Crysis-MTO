; Ultimate ASI Loader's settings. The loader reads the ini named as its own DLL (version.ini for version.dll):
; keep the two together, and rename this file too if you rename the DLL (winmm.dll and winmm.ini).
[GlobalSets]
; Load the ASI plugins as soon as the loader itself is loaded. The Steam release's own launchers (Bin32\Crysis.exe,
; Bin64\Crysis64.exe) load the loader only after their last call that would start the plugins otherwise, so
; without this line optiperf.asi is never loaded there. GOG's C1-Launcher and CryMP's client work either way.
DontLoadFromDllMain=0
