; optiperf — performance patches for Crysis (2007). Keep this file next to optiperf.asi.
; Every patch checks the game code it changes when it hooks; if the code isn't what it expects, that patch stays off
; and optiperf.log says why.

[ParticleBatch]
; Fixes a slow (quadratic) search in particle rendering. Big gains in snow/particle-heavy scenes.
;   fast   = on (default)
;   verify = also runs the original search and compares results (as slow as unpatched; for testing)
;   off    = leave the game code alone
Mode=fast

[Allocator]
; Replaces the engine's memory allocator with mimalloc: no global lock, and it fixes the 64-bit version crashing when
; a level loads.
;   mimalloc = on (default)
;   off      = keep the original allocator
Mode=mimalloc
; 64-bit only: address space (MB) set aside below 4 GB for the engine, which can't use memory above it. This only
; reserves addresses (no RAM is used until the game needs it); more is added automatically if it fills up.
LowMemoryMB=1536
; 64-bit only, for development (the pointer census below): each memory block remembers the code that allocated it.
;   off = (default)
;   on  = keep that address in the block's spare bytes
Owners=off

[ShadowPrepass]
; The render thread (64-bit game, DX10 only). The renderer's main pass, "the flush", runs on a thread of its own while
; the game goes on with its next frame beside it: the game's update, then its scene traversal, until the first call
; that has to wait for the flush. After the flush the same thread draws the HUD and presents the frame. This file
; turns it on, with every part below it needs. On the 32-bit game or with DX9 they stay off by themselves.
;   To turn the render thread off: FlushThread=main (the parts still prepare the main pass, on the main thread).
;   To leave the game's renderer alone entirely: Mode=off.
; Without a line, a setting is off (main, for FlushThread).
;
; The shadow casters, rendered before the renderer's main pass instead of inside it.
;   off     = leave the game code alone
;   on      = render the casters early and replay their output into each shadow map (set here)
;   verify  = as on, and check that every caster call gets the same inputs as in the game's own loop (logs differences)
;   compare = render them early and in the game's loop as well, and compare the output (for development)
Mode=on
; Where the casters are rendered: flush = before the renderer's main pass (set here); shadows = right before the
; shadow maps (for comparison).
At=flush
; Water reflections and the rest of the main pass's preprocess stage (needs Mode other than off):
;   off     = leave them alone
;   observe = change nothing; log what the preprocess stage does and what a reflection costs
;   on      = render the reflections' scenes before the main pass too, and replay them where the game draws them (set
;             here)
;   verify  = as on, and check that each replayed reflection gets the same inputs as the early one (logs differences)
Reflections=on
; Far-tree sprites, with the reflections (needs Reflections=on or verify):
;   off     = leave them in the main pass
;   on      = generate them before it, and decide there how they are drawn (set here)
;   verify  = as on, and generate them in the main pass again to compare (logs differences)
FarTrees=on
; Flash and video textures on in-game screens, with the reflections (needs Reflections=on or verify):
;   off     = update them in the main pass
;   on      = update them before it (set here)
;   verify  = as on, and check that the main pass would have updated them from the same inputs (logs differences)
DynTextures=on
; The 3D engine's environment as the main pass reads it (sun, sky, fog, water, view distance, the fog volumes' colour
; per object, the water level and vis area at the camera), needs Mode other than off:
;   off     = the main pass asks the 3D engine
;   on      = read it once before the main pass, and answer the main pass's calls from there (set here)
;   verify  = as on, and check every answer against the 3D engine's (logs differences)
Environment=on
; The particles' vertices, which the main pass asks the 3D engine for while drawing (needs Mode other than off):
;   off     = the main pass asks the 3D engine
;   on      = produce them right before the main pass, and hand them over where it draws them (set here)
;   verify  = as on, and produce them in the main pass too to compare (logs differences)
Particles=on
; The skinned characters' and bending plants' bone poses, which the main pass asks the animation system and the 3D
; engine for while drawing (needs Mode other than off):
;   off     = the main pass asks them
;   on      = ask right before the main pass, and answer its calls from there (set here)
;   verify  = as on, and ask in the main pass too to compare (logs differences)
Skinning=on
; The materials of objects with material layers (frozen, wet, cloaked), which the main pass asks the 3D engine about
; while drawing their layers (needs Mode other than off):
;   off     = the main pass asks the 3D engine
;   on      = copy them right before the main pass, and answer its calls from the copies (set here)
;   verify  = as on, and check every answer against the 3D engine's (logs differences)
Materials=on
; Other modules' console variables as the main pass reads them (the 3D engine's and the animation's, through their
; CrySystem objects), needs Mode other than off:
;   off     = the main pass asks CrySystem
;   on      = read them right before the main pass, and answer its calls from there (set here)
;   verify  = as on, and check every answer against CrySystem's (logs differences)
Cvars=on
; The system's and the timer's state as the main pass reads it (the frame's time and length, the time scale, the view
; camera, the 3D engine and timer pointers), needs Mode other than off:
;   off     = the main pass asks CrySystem
;   on      = read it once before the main pass, and answer the main pass's calls from there (set here)
;   verify  = as on, and check every answer against CrySystem's (logs differences)
System=on
; The 3D engine's dynamic lights and their shadow frustums as the main pass reads them, needs Mode other than off:
;   off     = the main pass reads the 3D engine's lights and frustums
;   on      = copy them right before the main pass, and point the main pass at the copies (set here)
;   verify  = as on, and check that nothing in the main pass still reaches the lights themselves (logs what it finds)
Lights=on
; The 3D engine's other data the main pass reads, which the game's next frame rewrites: the sky's, the ocean's and the
; water volumes' parameters, the objects' extra data (the terrain's texture coordinates, decals), and the terrain's
; colours for the far trees (those with FarTrees=on). Needs Mode other than off:
;   off     = the main pass reads the 3D engine's
;   on      = copy them right before the main pass, and point the main pass at the copies (set here)
;   verify  = as on, and check that nothing in the main pass still reaches the originals (logs what it finds)
EngineData=on
; Which thread runs the renderer's main pass. Needs Mode other than off.
;   main    = the game's main thread
;   worker  = a thread of its own, while the main thread waits for it (no speed-up: the same work on another thread)
;   overlap = a thread of its own, with the main thread going on beside it until its next call into the renderer that
;             has to wait for it (set here)
FlushThread=overlap
; With FlushThread=overlap, how far the game's next frame goes beside the flush:
;   off = to its start (the renderer's BeginFrame), at the latest
;   on  = into its update, to its scene traversal (the 3D engine's RenderWorld), at the latest (set here)
FlushThreadBarrier=on
; With the barrier on, the next frame's scene traversal itself (FlushThread=overlap):
;   off    = it waits for the flush first
;   beside = it runs beside the flush too: its calls into the renderer are recorded, answered from the record, and
;            made once the flush has ended (or at its first call that has to wait for it). Set here
;   verify = made as in the game, recorded, and the record replayed at the flush's entry and compared with what the
;            calls made, then the lists cut back (for development)
;   on     = recorded and not made, the record made at the flush's entry; the traversal still waits for the flush (for
;            development)
FlushThreadRecord=beside
; With FlushThread=overlap, the frame's end (the HUD's draws, the text and the present) on the renderer's thread too:
;   off = made by the game's main thread when it next waits for the main pass (default)
;   on  = made by the renderer's thread right after the main pass, while the game goes on with its next frame (set
;         here)
FlushThreadPresent=on
; With FlushThreadRecord=beside, for development: one traversal in eight that joined the flush is watched for the rest
; of it, and the log lists its calls that would have joined too (where first, from where). Costs 1-2 ms a watched frame.
;   off (default) | on
FlushThreadRecordObserve=off
; With FlushThread=overlap, for development: one join of the flush in eight keeps the main thread's renderer calls
; watched for the rest of its frame, and the log lists those that would have joined too (how many per frame, and from
; where the first came). Costs 1-3 ms a watched frame.
;   off (default) | on
FlushThreadObserve=off
; For tests: with FlushThread other than main, end the game when no flush has come for 20 s after the last one (a hang
; logged after 10 s frees the job queue at once). A level load that long ends it too.
;   off (default) | on
FlushThreadHangExit=off
; For development (the render thread): which fields of what the main pass works from point at memory other modules
; own. Needs Mode other than off and [Allocator] Owners=on; logs a list at the end.
;   off     = (default)
;   on      = look, on one flush in CensusEvery
Census=off
CensusEvery=64
; With the census: also which of the memory it found the main pass reading gets written, by the main pass itself and
; then by the game's next frame up to the next main pass (what a render thread would need copied).
CensusChanges=off
; With the census: every read and write of that memory in the main pass, not just the first on each memory page, so the
; log also says which parts of it the main pass uses, and which of those the next frame writes. Slow; turns
; CensusChanges on.
CensusReads=off

[Debug]
; Logs crashes, error boxes and unexpected exits (with the engine call chain) to the log file: useful for bug reports.
Diagnostics=1
; Times the main thread's frame by phase (the systems' update, the scene traversal, the renderer's flush, the present)
; and estimates the frame with the flush on a render thread: lines "frame phases" in the log. A development aid.
FramePhases=off
; Times the main thread's calls into the renderer's producer methods (EF_GetObject, a render mesh's Render, ...), per
; frame phase with FramePhases=on: what replaying them later would cost. Not with the call tracer, nor with
; [ShadowPrepass] FlushThread=overlap. A development aid.
ProducerTiming=off

[Log]
; Log file, relative to this folder. Empty = optiperf.log next to optiperf.asi; "none" = no log file.
File=

[Trace]
; Developer tool, leave empty for playing: counts calls between engine modules (per method, caller and thread) and
; writes optiperf_trace_*.tsv next to the log. Slows the game down a lot.
;   renderer = calls into the renderer (needs the DX10 renderer or the 64-bit game: the 32-bit DX9 renderer has no
;              class information to find its methods by)
;   all      = calls between all engine modules (64-bit game only, for the same reason)
Modules=
